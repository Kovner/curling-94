name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main, claude/nifty-goodall-i9lo2h]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: npm test
      - name: Assemble site (the game only; no tests, notes or tooling)
        run: |
          mkdir _site
          cp index.html *.js _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
