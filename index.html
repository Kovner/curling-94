<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CURLING '94</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: monospace; color: #9cc4dc;
    overflow: hidden;
  }
  #game {
    width: min(100vw, calc((100vh - 28px) * 256 / 240));
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
  }
  #hint {
    font-size: 11px; letter-spacing: 1px; padding: 6px;
    text-transform: uppercase; text-align: center;
  }
</style>
</head>
<body>
  <canvas id="game" width="256" height="240"></canvas>
  <div id="hint">arrows + space/enter &middot; mash space to sweep &middot; hurry hard!</div>
  <script src="game.js"></script>
</body>
</html>
